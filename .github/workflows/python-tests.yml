name: Python tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pypdf

      - name: Byte-compile sources
        run: python -m compileall -q .

      - name: Run unit and PDF tests
        run: python -m unittest discover -s tests -v

      - name: Generate sample report
        run: |
          python generate.py \
            --input sample_input/example_scan.json \
            --firm "Example Law Firm LLP" \
            --output ci_output \
            --date "13 November 2026"
          python - <<'PY'
          import re
          from pathlib import Path
          from pypdf import PdfReader

          reports = sorted(Path("ci_output").glob("*.pdf"))
          assert len(reports) == 1, f"Expected one PDF, found {reports}"
          reader = PdfReader(str(reports[0]))
          text = re.sub(r"\s+", " ", "\n".join(page.extract_text() or "" for page in reader.pages))
          assert len(reader.pages) >= 12, f"Unexpected page count: {len(reader.pages)}"
          for phrase in (
              "CYBER SECURITY ASSESSMENT REPORT",
              "EXECUTIVE SUMMARY",
              "DETAILED FINDINGS",
              "REMEDIATION ROADMAP",
              "Report reviewed by:",
              "CONFIDENTIAL",
          ):
              assert phrase in text, f"Missing PDF section: {phrase}"
          print(f"Validated {reports[0]} ({len(reader.pages)} pages)")
          PY

      - name: Upload sample report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: sample-sra-report
          path: ci_output/*.pdf
          if-no-files-found: error
